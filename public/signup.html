<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start your free trial — KYC Copilot</title>
  <link rel="stylesheet" href="/design-system/tokens.css">
  <link rel="stylesheet" href="/design-system/css/text.css">
  <link rel="stylesheet" href="/design-system/css/stack.css">
  <link rel="stylesheet" href="/design-system/css/grid.css">
  <link rel="stylesheet" href="/design-system/css/card.css">
  <link rel="stylesheet" href="/design-system/css/badge.css">
  <link rel="stylesheet" href="/design-system/css/button.css">
  <link rel="stylesheet" href="/design-system/css/input.css">
  <style>
    /* Page shell — structural rules only; every value binds to a token. */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.9fr) minmax(0, 1fr);
      align-items: center;
      gap: var(--space-24);
      padding: var(--space-24);
      background: var(--surface-page);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }
    body > .ds-card { grid-column: 2; }
    svg { width: var(--space-24); height: var(--space-24); fill: none; stroke: var(--action-primary); stroke-width: var(--space-2); stroke-linecap: round; stroke-linejoin: round; }
    a { color: var(--action-text); text-decoration: none; }
    a:hover { text-decoration: underline; }
    [data-plan] input { display: none; }
    #signup-form .ds-btn { width: 100%; }
    #cancelled-banner { display: none; padding: var(--space-10) var(--space-12); border-radius: var(--radius-8); background: var(--status-warning-bg); border: var(--border-width) solid var(--status-warning-border); color: var(--status-warning); font-size: var(--text-13); }
    #error-box { display: none; padding: var(--space-10) var(--space-12); border-radius: var(--radius-8); background: var(--status-danger-bg); border: var(--border-width) solid var(--status-danger-border); color: var(--status-danger); font-size: var(--text-13); }
    @media (max-width: 860px) {
      body { grid-template-columns: minmax(0, 1fr); }
      body > .ds-card { grid-column: 1; }
      .ds-grid--3 { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <main class="ds-card ds-stack ds-stack--lg">
    <div class="ds-stack ds-stack--sm">
      <div class="ds-stack ds-stack--row ds-stack--sm ds-stack--center">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        <span class="ds-text-body-md"><strong>KYC Copilot</strong></span>
      </div>
      <h1 class="ds-text-heading-xl">Create your account</h1>
      <p class="ds-text-body-md ds-text-muted">Self-serve provisioning — your workspace is live immediately.</p>
    </div>

    <div id="cancelled-banner">
      Checkout was cancelled — your account is set up, just complete billing to activate your subscription.
    </div>

    <form id="signup-form" class="ds-stack ds-stack--lg">
      <div class="ds-stack ds-stack--xs">
        <label class="ds-text-caption-sm" for="company">Company name</label>
        <input class="ds-input" id="company" name="company" type="text" required autocomplete="organization">
      </div>
      <div class="ds-stack ds-stack--xs">
        <label class="ds-text-caption-sm" for="email">Work email</label>
        <input class="ds-input" id="email" name="email" type="email" required autocomplete="email">
      </div>
      <div class="ds-stack ds-stack--xs">
        <label class="ds-text-caption-sm" for="password">Password (min 12 characters)</label>
        <input class="ds-input" id="password" name="password" type="password" minlength="12" required autocomplete="new-password">
      </div>
      <div class="ds-stack ds-stack--xs">
        <label class="ds-text-caption-sm" for="confirm">Confirm password</label>
        <input class="ds-input" id="confirm" name="confirm" type="password" minlength="12" required autocomplete="new-password">
      </div>

      <div class="ds-stack ds-stack--xs">
        <span class="ds-text-caption-sm">Choose your plan</span>
        <div class="ds-grid ds-grid--3">
          <label class="ds-card ds-card--interactive ds-stack ds-stack--xs" data-plan="starter">
            <input type="radio" name="plan" value="starter" checked>
            <span class="ds-badge ds-badge--success">14-day trial</span>
            <span class="ds-text-body-md"><strong>Starter</strong></span>
            <span class="ds-text-body-md"><strong>€99</strong><span class="ds-text-caption-sm">/mo · 50 cases</span></span>
          </label>
          <label class="ds-card ds-card--interactive ds-stack ds-stack--xs" data-plan="growth">
            <input type="radio" name="plan" value="growth">
            <span class="ds-text-body-md"><strong>Growth</strong></span>
            <span class="ds-text-body-md"><strong>€499</strong><span class="ds-text-caption-sm">/mo · 500 cases</span></span>
          </label>
          <label class="ds-card ds-card--interactive ds-stack ds-stack--xs" data-plan="enterprise">
            <input type="radio" name="plan" value="enterprise">
            <span class="ds-text-body-md"><strong>Enterprise</strong></span>
            <span class="ds-text-caption-sm">Custom · unlimited</span>
          </label>
        </div>
      </div>

      <button class="ds-btn ds-btn--primary" id="submit-btn" type="submit">Create account &amp; start trial</button>
    </form>
    <div id="error-box"></div>
    <div class="ds-stack ds-stack--center">
      <span class="ds-text-caption-sm">Already have an account? <a href="/login.html">Log in</a></span>
    </div>
  </main>

  <script>
    // ?plan=starter pre-selects a plan (Phase F).
    const planParam = new URLSearchParams(window.location.search).get('plan');
    if (planParam) {
      const radio = document.querySelector(`input[name="plan"][value="${planParam}"]`);
      if (radio) radio.checked = true;
    }
    if (new URLSearchParams(window.location.search).get('cancelled') === '1') {
      document.getElementById('cancelled-banner').style.display = 'block';
    }

    function syncSelected() {
      document.querySelectorAll('[data-plan]').forEach((card) => {
        card.classList.toggle('is-selected', card.querySelector('input').checked);
      });
    }
    document.querySelectorAll('[data-plan] input').forEach((input) => {
      input.addEventListener('change', syncSelected);
    });
    syncSelected();

    const form = document.getElementById('signup-form');
    const errorBox = document.getElementById('error-box');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) {
        errorBox.textContent = 'Passwords do not match.';
        errorBox.style.display = 'block';
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating your workspace…';
      try {
        const res = await fetch('/provision', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('company').value.trim(),
            email: document.getElementById('email').value.trim(),
            password,
            plan: document.querySelector('input[name="plan"]:checked').value
          })
        });
        if (res.status === 409) {
          errorBox.textContent = 'An account with this email already exists. Log in instead.';
          errorBox.style.display = 'block';
          return;
        }
        if (!res.ok) {
          errorBox.textContent = 'Signup failed — please check your details and try again.';
          errorBox.style.display = 'block';
          return;
        }
        const data = await res.json();
        // Store credentials so the dashboard is authenticated immediately
        // after checkout returns (Stripe success URL is /app?welcome=1).
        const loginRes = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password
          })
        });
        if (loginRes.ok) {
          const session = await loginRes.json();
          localStorage.setItem('kyc_access_token', session.accessToken);
          localStorage.setItem('kyc_refresh_token', session.refreshToken);
        }
        if (data.checkoutUrl) {
          window.location.href = data.checkoutUrl; // Stripe Checkout
        } else {
          window.location.href = '/app?welcome=1'; // dev / zero-key mode
        }
      } catch {
        errorBox.textContent = 'Network error — please try again.';
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account & start trial';
      }
    });
  </script>
</body>
</html>
