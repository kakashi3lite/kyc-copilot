<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — KYC Copilot</title>
  <link rel="stylesheet" href="/design-system/tokens.css">
  <link rel="stylesheet" href="/design-system/css/text.css">
  <link rel="stylesheet" href="/design-system/css/stack.css">
  <link rel="stylesheet" href="/design-system/css/card.css">
  <link rel="stylesheet" href="/design-system/css/button.css">
  <link rel="stylesheet" href="/design-system/css/input.css">
  <style>
    /* Page shell — structural rules only; every value binds to a token. */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr) minmax(0, 1fr);
      align-items: center;
      gap: var(--space-24);
      padding: var(--space-24);
      background: var(--surface-page);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }
    body > .ds-card { grid-column: 2; }
    svg { width: var(--space-24); height: var(--space-24); fill: none; stroke: var(--action-primary); stroke-width: var(--space-2); stroke-linecap: round; stroke-linejoin: round; }
    a { color: var(--action-text); text-decoration: none; }
    a:hover { text-decoration: underline; }
    #login-form .ds-btn { width: 100%; }
    #error-box { display: none; padding: var(--space-10) var(--space-12); border-radius: var(--radius-8); background: var(--status-danger-bg); border: var(--border-width) solid var(--status-danger-border); color: var(--status-danger); font-size: var(--text-13); }
    @media (max-width: 860px) {
      body { grid-template-columns: minmax(0, 1fr); }
      body > .ds-card { grid-column: 1; }
    }
  </style>
</head>
<body>
  <main class="ds-card ds-stack ds-stack--lg">
    <div class="ds-stack ds-stack--sm">
      <div class="ds-stack ds-stack--row ds-stack--sm ds-stack--center">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        <span class="ds-text-body-md"><strong>KYC Copilot</strong></span>
      </div>
      <h1 class="ds-text-heading-xl">Welcome back</h1>
      <p class="ds-text-body-md ds-text-muted">Log in to your compliance dashboard.</p>
    </div>
    <form id="login-form" class="ds-stack ds-stack--lg">
      <div class="ds-stack ds-stack--xs">
        <label class="ds-text-caption-sm" for="email">Email</label>
        <input class="ds-input" id="email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="ds-stack ds-stack--xs">
        <label class="ds-text-caption-sm" for="password">Password</label>
        <input class="ds-input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="ds-btn ds-btn--primary" id="submit-btn" type="submit">Log in</button>
    </form>
    <div id="error-box"></div>
    <div class="ds-stack ds-stack--xs">
      <a href="/forgot-password.html">Forgot password?</a>
      <a href="/signup.html">Don't have an account? Sign up</a>
    </div>
    <p class="ds-text-caption-sm">Demo: admin@example.test / ChangeMe-123456</p>
  </main>

  <script>
    // Already logged in → straight to the dashboard.
    try {
      const token = localStorage.getItem('kyc_access_token');
      if (token) {
        const payload = JSON.parse(atob(token.split('.')[1]));
        if (payload.exp * 1000 > Date.now()) window.location.replace('/app');
      }
    } catch { /* malformed token — let them log in */ }

    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in…';
      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });
        if (res.status === 429) {
          errorBox.textContent = 'Too many attempts. Please wait and try again.';
          errorBox.style.display = 'block';
          return;
        }
        if (!res.ok) {
          errorBox.textContent = 'Invalid email or password';
          errorBox.style.display = 'block';
          return;
        }
        const data = await res.json();
        localStorage.setItem('kyc_access_token', data.accessToken);
        localStorage.setItem('kyc_refresh_token', data.refreshToken);
        window.location.replace('/app');
      } catch {
        errorBox.textContent = 'Network error — please try again.';
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
