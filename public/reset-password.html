<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set new password — KYC Copilot</title>
  <style>
    :root { --bg: #0a0a0f; --fg: #f1f5f9; --card: #16161e; --border: #1e1e2e; --blue: #2563eb; --blue-hover: #1d4ed8; --muted: #94a3b8; --emerald: #10b981; --red: #ef4444; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; -webkit-font-smoothing: antialiased; }
    .card { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; margin-bottom: 24px; }
    h2 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
    label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin: 14px 0 6px; }
    input { width: 100%; padding: 12px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--fg); font-size: 15px; outline: none; }
    input:focus { border-color: var(--blue); }
    .btn { width: 100%; margin-top: 20px; padding: 13px; background: var(--blue); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: var(--blue-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--red); font-size: 13px; }
    .links { margin-top: 18px; font-size: 13px; text-align: center; }
    .links a { color: var(--blue); text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      KYC Copilot
    </div>
    <h2>Set a new password</h2>
    <p>Choose a strong password (min 12 characters). All existing sessions will be signed out.</p>
    <form id="reset-form">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" minlength="12" required autocomplete="new-password">
      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" minlength="12" required autocomplete="new-password">
      <button class="btn" id="submit-btn" type="submit">Set new password</button>
    </form>
    <div class="error" id="error-box"></div>
    <div class="links"><a href="/login.html">← Back to login</a></div>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    const form = document.getElementById('reset-form');
    const errorBox = document.getElementById('error-box');
    const submitBtn = document.getElementById('submit-btn');

    if (!token) {
      errorBox.textContent = 'Missing reset token. Please request a new link.';
      errorBox.style.display = 'block';
      submitBtn.disabled = true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) {
        errorBox.textContent = 'Passwords do not match.';
        errorBox.style.display = 'block';
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving…';
      try {
        const res = await fetch('/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: password })
        });
        if (!res.ok) {
          const data = await res.json().catch(() => null);
          errorBox.textContent = data?.detail || 'Invalid or expired reset token.';
          errorBox.style.display = 'block';
          return;
        }
        window.location.href = '/login.html';
      } catch {
        errorBox.textContent = 'Network error — please try again.';
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Set new password';
      }
    });
  </script>
</body>
</html>
