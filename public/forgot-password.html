<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password — KYC Copilot</title>
  <style>
    :root { --bg: #0a0a0f; --fg: #f1f5f9; --card: #16161e; --border: #1e1e2e; --blue: #2563eb; --blue-hover: #1d4ed8; --muted: #94a3b8; --emerald: #10b981; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; -webkit-font-smoothing: antialiased; }
    .card { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; margin-bottom: 24px; }
    h2 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
    label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin: 14px 0 6px; }
    input { width: 100%; padding: 12px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--fg); font-size: 15px; outline: none; }
    input:focus { border-color: var(--blue); }
    .btn { width: 100%; margin-top: 20px; padding: 13px; background: var(--blue); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: var(--blue-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { display: none; margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-size: 13px; }
    .msg.ok { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: var(--emerald); }
    .links { margin-top: 18px; font-size: 13px; text-align: center; }
    .links a { color: var(--blue); text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      KYC Copilot
    </div>
    <h2>Reset your password</h2>
    <p>Enter your email and we'll send you a secure reset link (valid for 1 hour).</p>
    <form id="forgot-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <button class="btn" id="submit-btn" type="submit">Send reset link</button>
    </form>
    <div class="msg ok" id="msg-box"></div>
    <div class="links"><a href="/login.html">← Back to login</a></div>
  </div>

  <script>
    const form = document.getElementById('forgot-form');
    const msgBox = document.getElementById('msg-box');
    const submitBtn = document.getElementById('submit-btn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';
      try {
        const res = await fetch('/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() })
        });
        if (res.ok) {
          // Always show the same message regardless of whether the email
          // exists — we never leak account existence.
          msgBox.style.display = 'block';
          msgBox.textContent = 'If that email is registered, a reset link has been sent.';
          form.style.display = 'none';
        }
      } catch { /* leave button re-enabled */ }
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send reset link';
    });
  </script>
</body>
</html>
