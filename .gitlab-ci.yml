# ─────────────────────────────────────────────────────────────────────────────
# KYC Copilot — GitLab CI/CD
#
# Chronology = maximum productivity (fail fast, cheapest jobs first):
#
#   validate ──► test ──► security ──► integration ──► build ──► deploy
#   (typecheck)  (unit+eval+ds-gates) (audit/SAST) (full DB gate) (tsc+docker) (manual)
#
# Fast-feedback loop: typecheck (~10s) and unit+eval (~10s) run on every MR
# before anything heavy. The authoritative gate is `full-gate`, which mirrors
# `docker compose run --rm test` against real Postgres + Redis.
#
# Design-system drift gates (token lint · contrast · registry · visual
# regression) run as `design-system-gates` in the test stage — fail-fast order,
# artifacts on always (contrast report + VR diff screenshots). See job below.
#
# NOTE: `npm install` in this repo requires `--legacy-peer-deps`
# (@langchain/* peer resolution — see Dockerfile). Never "fix" that with
# --force; it is the documented, supported install mode.
# ─────────────────────────────────────────────────────────────────────────────

include:
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - validate
  - test
  - security
  - integration
  - build
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: node:20-bookworm
  timeout: 25m
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# Fast dependency cache keyed on the lockfile (reuse across jobs/stages).
cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
  policy: pull-push

variables:
  # ── Test environment (matches .github/workflows/ci.yml and compose `test`) ──
  NODE_ENV: "test"
  LLM_TIER_PRIMARY: "t0"
  LOG_LEVEL: "error"
  OTEL_ENABLED: "false"
  DATABASE_URL: "postgres://kyc:kyc@postgres:5432/kyc"
  REDIS_URL: "redis://redis:6379"
  S3_ENDPOINT: "http://minio:9000"
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin"
  S3_BUCKET: "kyc-evidence"
  ENCRYPTION_KEY: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
  JWT_SECRET: "test-access-secret-change-me"
  JWT_REFRESH_SECRET: "test-refresh-secret-change-me"
  ALLOWED_ORIGINS: "http://localhost:3000"
  # ── Postgres/Redis service credentials ─────────────────────────────────────
  POSTGRES_USER: "kyc"
  POSTGRES_PASSWORD: "kyc"
  POSTGRES_DB: "kyc"
  POSTGRES_HOST_AUTH_METHOD: "trust"

# ── Hidden templates ─────────────────────────────────────────────────────────

.install:
  before_script:
    - npm install --legacy-peer-deps --no-audit --no-fund

.db-services:
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis

# Branch pipelines run only when code/CI-relevant files change; docs-only
# pushes skip every job below. History note (2026-09-28): the previous rule
# matched ANY changed .md file, so the full gate was skipped on every push
# that touched docs (e.g. pipeline #8 at ccbbba4 ran only SAST + secret
# detection). Fixed by inverting to a code-path whitelist.
.default-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "src/**/*"
        - "tests/**/*"
        - "scripts/**/*"
        - "public/**/*"
        - "infra/**/*"
        - "package.json"
        - "package-lock.json"
        - "tsconfig.json"
        - "tsconfig.build.json"
        - "vitest.config.ts"
        - "drizzle.config.ts"
        - "Dockerfile"
        - "docker-compose.yml"
        - "fly.toml"
        - ".env.example"
        - "design-system/**/*"
        - ".gitlab-ci.yml"
    # Default-branch push with no code changes (docs-only): skip.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never

# ── 1. validate ──────────────────────────────────────────────────────────────

typecheck:
  stage: validate
  extends: .install
  script:
    - npm run typecheck
  rules: !reference [.default-rules, rules]

# ── 2. test (parallel, no DB) ────────────────────────────────────────────────

unit-test:
  stage: test
  extends: .install
  script:
    - npm run test:unit
  rules: !reference [.default-rules, rules]

eval-golden:
  stage: test
  extends: .install
  script:
    - npm run test:eval
    - npm run bench:eval
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - tests/evaluation/reports/latest.json
      - tests/evaluation/BASELINES.md
  rules: !reference [.default-rules, rules]

# ── 2b. design-system gates — the four gates (token lint · contrast · registry · VR) ──

# Fast gates first (no DB, no browser); the VR gate boots the real app and needs
# Postgres + Redis + Chromium. Fails the pipeline on any drift; uploads the
# contrast report and diff screenshots as artifacts.
# NOTE: substitutes the design-loop commands — `npm run token-lint` (no such
# npx package) · `npm run registry-check` · `npm run ds-vr` (playwright library,
# no @playwright/test dependency).
design-system-gates:
  stage: test
  extends: [.install, .db-services]
  script:
    - mkdir -p design-system-artifacts
    - npm run token-lint
    - npm run token-lint -- design-system/layouts.html
    - npm run token-lint -- design-system/components.html
    - 'node design-system/tokens/contrast-check.mjs > design-system-artifacts/contrast-report.txt 2>&1 || { cat design-system-artifacts/contrast-report.txt; exit 1; }'
    - cat design-system-artifacts/contrast-report.txt
    - npm run registry-check
    - npm run db:migrate
    - npm run db:seed
    - npx playwright install --with-deps chromium
    - npm run ds-vr
  artifacts:
    name: "design-system-gates"
    when: always
    expire_in: 7 days
    paths:
      - design-system-artifacts/
      - design-system/visual-regression/current/
  rules: !reference [.default-rules, rules]

# ── local-only verification — strategic materials must never land on remotes ──
local-only-verification:
  stage: test
  script:
    - |
      FORBIDDEN_PATTERNS="^(\.design-loop/|docs/CANADIAN_READINESS\.md$|docs/MARKET_INTELLIGENCE\.md$|docs/PLAN_.*\.md$|docs/SESSION_REPORT_.*\.md$|docs/CANADIAN_MARKET_IMPACT_BRIEF\.md$|docs/DEMO_PACKAGE_.*\.md$|demo/|demo-package/|prospects/|wiki/|scratch/|\.security-sweep/|.*\.loom-script\.md$|.*\.canadian-brief\.md$|.*\.demo-runbook\.md$)"
      VIOLATIONS=$(git ls-files | grep -E "$FORBIDDEN_PATTERNS" || true)
      if [ -n "$VIOLATIONS" ]; then
        echo "BLOCKED: local-only files present on remote:"
        echo "$VIOLATIONS"
        exit 1
      fi
      echo "OK: no local-only files present"
  rules: !reference [.default-rules, rules]

# ── 3. security (supply-chain + SAST + secrets, parallel) ────────────────────

npm-audit:
  stage: security
  image: node:20-bookworm
  script:
    - npm audit --audit-level=moderate
  rules: !reference [.default-rules, rules]

# Security template jobs — re-staged so they run after unit/eval, before the
# DB gate (fast security feedback, no DB dependency).
gemnasium-dependency_scanning:
  stage: security

semgrep-sast:
  stage: security

secret_detection:
  stage: security

# ── 4. integration — the authoritative gate (real Postgres + Redis) ──────────

full-gate:
  stage: integration
  extends: [.install, .db-services]
  script:
    - npm run db:migrate
    - npm run test
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      coverage_report:
        # GitLab supports cobertura/jacoco in coverage_report — NOT lcov.
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
  rules: !reference [.default-rules, rules]

# ── 5. build ─────────────────────────────────────────────────────────────────

build-ts:
  stage: build
  extends: .install
  script:
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - dist/
  rules: !reference [.default-rules, rules]

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  script:
    - docker build -t "$IMAGE_TAG" .
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
        docker tag "$IMAGE_TAG" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
        docker push "$IMAGE_TAG"
      fi
  rules: !reference [.default-rules, rules]

# ── 6. deploy (manual, production approval) ──────────────────────────────────

# Prerequisites (run once before the first deploy):
#   1. bash infra/fly-secrets.sh      # inject secrets incl. PII_REDACTION_KEY
#   2. Add GitLab CI/CD variable: FLY_API_TOKEN=<fly personal token> (masked,
#      protected, environment scope: production). Do NOT commit it.
deploy-production:
  stage: deploy
  image: superfly/flyctl:latest
  environment:
    name: production
    url: https://kyc-copilot.fly.dev
  script:
    - flyctl deploy --app kyc-copilot --remote-only --strategy rolling
  rules:
    # Docs-only pushes must not offer a deploy (mirrors .default-rules).
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "src/**/*"
        - "tests/**/*"
        - "scripts/**/*"
        - "public/**/*"
        - "infra/**/*"
        - "package.json"
        - "package-lock.json"
        - "tsconfig.json"
        - "tsconfig.build.json"
        - "vitest.config.ts"
        - "drizzle.config.ts"
        - "Dockerfile"
        - "docker-compose.yml"
        - "fly.toml"
        - ".env.example"
        - "design-system/**/*"
        - ".gitlab-ci.yml"
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
  needs:
    # optional:true — a docs/CI-only push may exclude full-gate/docker-build;
    # a hard need on a non-existent job rejects the whole pipeline.
    - job: full-gate
      optional: true
    - job: docker-build
      optional: true
